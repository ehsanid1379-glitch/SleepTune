name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sleeptune/app
          cat > settings.gradle.kts <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SleepTune"
          include(":app")
          GRADLE

          cat > build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          GRADLE

          cat > gradle.properties <<'GRADLE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          GRADLE

          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.sleeptune.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.sleeptune.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "1.2"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:theme="@android:style/Theme.Material.NoActionBar" android:label="SleepTune" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".PlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          MANIFEST

          cat > app/src/main/java/com/sleeptune/app/MainActivity.kt <<'KOTLIN'
          package com.sleeptune.app

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import android.graphics.drawable.GradientDrawable

          class MainActivity : Activity() {
              private lateinit var baseSeek: SeekBar
              private lateinit var diffSeek: SeekBar
              private lateinit var speedSeek: SeekBar
              private lateinit var baseLabel: TextView
              private lateinit var diffLabel: TextView
              private lateinit var speedLabel: TextView
              private lateinit var diffTitle: TextView
              private lateinit var visualizer: WaveView
              private lateinit var modeGroup: RadioGroup
              private lateinit var songCheck: CheckBox
              private lateinit var songButton: Button
              private lateinit var durationSeek: SeekBar
              private lateinit var durationLabel: TextView
              private var songUri: Uri? = null
              private var baseChosen = false
              private var diffChosen = false
              private var speedChosen = false
              private var playing = false
              private val pickSongCode = 77

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(13, 16, 29)
                  window.navigationBarColor = Color.rgb(13, 16, 29)
                  window.decorView.systemUiVisibility = 0
                  buildUi()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun buildUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(16), dp(18), dp(18))
                      setBackgroundColor(Color.rgb(13, 16, 29))
                  }
                  val scroll = ScrollView(this)
                  scroll.addView(root)

                  root.addView(TextView(this).apply {
                      text = "SleepTune"
                      textSize = 29f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                      gravity = Gravity.CENTER
                  }, fullWidth())
                  root.addView(TextView(this).apply {
                      text = "تنظیم صدا و مشاهده‌ی موج زنده"
                      textSize = 14f
                      setTextColor(Color.rgb(167, 177, 205))
                      gravity = Gravity.CENTER
                      setPadding(0, dp(3), 0, dp(14))
                  }, fullWidth())

                  visualizer = WaveView(this)
                  visualizer.layoutParams = LinearLayout.LayoutParams(-1, dp(130)).apply { bottomMargin = dp(16) }
                  root.addView(visualizer)

                  root.addView(sectionTitle("حالت پخش"))
                  modeGroup = RadioGroup(this).apply { orientation = RadioGroup.VERTICAL }
                  val independent = RadioButton(this).apply { text = "مستقل؛ صدای یکسان در هر دو گوش"; id = View.generateViewId(); setTextColor(Color.WHITE); textSize = 14f }
                  val combined = RadioButton(this).apply { text = "ترکیبی؛ اختلاف فرکانس بین دو گوش"; id = View.generateViewId(); setTextColor(Color.WHITE); textSize = 14f }
                  modeGroup.addView(independent)
                  modeGroup.addView(combined)
                  independent.isChecked = true
                  root.addView(modeGroup)

                  val basePair = addSlider(root, "فرکانس پایه", 750, 150, "انتخاب نشده") { seek ->
                      baseChosen = true
                      val base = seek.progress + 50
                      baseLabel.text = "فرکانس پایه: $base Hz"
                      diffSeek.max = (base - 1).coerceAtLeast(0)
                      if (diffSeek.progress > diffSeek.max) diffSeek.progress = diffSeek.max
                      if (diffChosen) diffLabel.text = "اختلاف فرکانس: ${diffSeek.progress} Hz"
                      visualizer.setParams(base, diffSeek.progress, modeGroup.checkedRadioButtonId == combined.id)
                      updateServiceIfPlaying()
                  }
                  baseSeek = basePair.first
                  baseLabel = basePair.second

                  diffTitle = sectionTitle("اختلاف فرکانس")
                  root.addView(diffTitle)
                  val diffPair = createSlider(800, 0, "انتخاب نشده") { seek ->
                      diffChosen = true
                      diffLabel.text = "اختلاف فرکانس: ${seek.progress} Hz"
                      visualizer.setParams(baseSeek.progress + 50, seek.progress, modeGroup.checkedRadioButtonId == combined.id)
                      updateServiceIfPlaying()
                  }
                  diffSeek = diffPair.first
                  diffLabel = diffPair.second
                  root.addView(diffSeek, fullWidth())
                  root.addView(diffLabel, fullWidth())
                  diffSeek.max = 49

                  val speedPair = createSlider(49, 0, "انتخاب نشده") { seek ->
                      speedChosen = true
                      val secs = 0.2 + seek.progress * (9.8 / 49.0)
                      speedLabel.text = "سرعت جابه‌جایی: ${String.format(java.util.Locale.US, "%.1f", secs)} ثانیه"
                      updateServiceIfPlaying()
                  }
                  speedSeek = speedPair.first
                  speedLabel = speedPair.second
                  root.addView(sectionTitle("سرعت جابه‌جایی بین گوش‌ها"))
                  root.addView(speedSeek, fullWidth())
                  root.addView(speedLabel, fullWidth())

                  modeGroup.setOnCheckedChangeListener { _, checkedId ->
                      val isCombined = checkedId == combined.id
                      diffTitle.visibility = if (isCombined) View.VISIBLE else View.GONE
                      diffSeek.visibility = if (isCombined) View.VISIBLE else View.GONE
                      diffLabel.visibility = if (isCombined) View.VISIBLE else View.GONE
                      visualizer.setParams(if (baseChosen) baseSeek.progress + 50 else 200, if (diffChosen) diffSeek.progress else 0, isCombined)
                      updateServiceIfPlaying()
                  }
                  // Initial state: no values are considered selected until the user touches each relevant slider.
                  diffTitle.visibility = View.GONE
                  diffSeek.visibility = View.GONE
                  diffLabel.visibility = View.GONE

                  root.addView(sectionTitle("آهنگ قبل از صدا (اختیاری)"))
                  songCheck = CheckBox(this).apply {
                      text = "ابتدا آهنگ پخش شود"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                  }
                  root.addView(songCheck)
                  songButton = Button(this).apply {
                      text = "انتخاب آهنگ از گوشی"
                      setOnClickListener {
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "audio/*"
                          }
                          startActivityForResult(intent, pickSongCode)
                      }
                  }
                  root.addView(songButton, fullWidth())
                  durationLabel = TextView(this).apply { text = "مدت آهنگ: انتخاب نشده"; setTextColor(Color.WHITE); textSize = 14f; setPadding(0, dp(5), 0, dp(2)) }
                  root.addView(durationLabel, fullWidth())
                  durationSeek = SeekBar(this).apply {
                      max = 179
                      progress = 29
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              durationLabel.text = "مدت آهنگ: ${progress + 1} دقیقه"
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }
                  root.addView(durationSeek, fullWidth())

                  val start = Button(this).apply {
                      text = "▶  شروع پخش"
                      textSize = 16f
                      setOnClickListener { startPlayback() }
                  }
                  root.addView(start, fullWidth())
                  root.addView(Button(this).apply {
                      text = "■  توقف"
                      textSize = 16f
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, PlaybackService::class.java))
                          playing = false
                          visualizer.isRunning = false
                          Toast.makeText(this@MainActivity, "پخش متوقف شد", Toast.LENGTH_SHORT).show()
                      }
                  }, fullWidth())
                  root.addView(TextView(this).apply {
                      text = "در حالت ترکیبی، اختلاف فرکانس باید از فرکانس پایه کمتر باشد. تغییر اسلایدرها هنگام پخش فوراً اعمال می‌شود."
                      textSize = 12f
                      setTextColor(Color.rgb(160, 170, 195))
                      setPadding(0, dp(12), 0, dp(6))
                  }, fullWidth())
                  setContentView(scroll)
              }

              private fun fullWidth() = LinearLayout.LayoutParams(-1, -2)

              private fun sectionTitle(textValue: String) = TextView(this).apply {
                  text = textValue
                  textSize = 16f
                  typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                  setTextColor(Color.rgb(196, 210, 255))
                  setPadding(0, dp(13), 0, dp(3))
              }

              private fun addSlider(parent: LinearLayout, title: String, max: Int, initial: Int, initialText: String, changed: (SeekBar) -> Unit): Pair<SeekBar, TextView> {
                  parent.addView(sectionTitle(title))
                  val pair = createSlider(max, initial, initialText, changed)
                  parent.addView(pair.first, fullWidth())
                  parent.addView(pair.second, fullWidth())
                  return pair
              }

              private fun createSlider(max: Int, initial: Int, initialText: String, changed: (SeekBar) -> Unit): Pair<SeekBar, TextView> {
                  val label = TextView(this).apply { text = initialText; setTextColor(Color.WHITE); textSize = 14f; setPadding(0, 0, 0, dp(4)) }
                  val seek = SeekBar(this).apply {
                      this.max = max
                      progress = initial.coerceIn(0, max)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) { if (fromUser) changed(this@apply) }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) { if (seekBar != null) changed(seekBar) }
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }
                  return Pair(seek, label)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == pickSongCode && resultCode == RESULT_OK) {
                      songUri = data?.data
                      if (songUri != null) {
                          contentResolver.takePersistableUriPermission(songUri!!, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          songButton.text = "آهنگ انتخاب شد ✓"
                      }
                  }
              }

              private fun startPlayback() {
                  if (!baseChosen) {
                      Toast.makeText(this, "ابتدا فرکانس پایه را تنظیم کنید", Toast.LENGTH_LONG).show()
                      return
                  }
                  val isCombined = modeGroup.checkedRadioButtonId == modeGroup.getChildAt(1).id
                  val base = baseSeek.progress + 50
                  val diff = if (diffChosen) diffSeek.progress else 0
                  if (isCombined && !diffChosen) {
                      Toast.makeText(this, "ابتدا اختلاف فرکانس را تنظیم کنید", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (isCombined && diff >= base && diff != 0) {
                      Toast.makeText(this, "اختلاف فرکانس باید از فرکانس پایه کمتر باشد", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (isCombined && !speedChosen) {
                      Toast.makeText(this, "ابتدا سرعت جابه‌جایی را تنظیم کنید", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (songCheck.isChecked && songUri == null) {
                      Toast.makeText(this, "ابتدا آهنگ را انتخاب کنید یا گزینه‌ی آهنگ را خاموش کنید", Toast.LENGTH_LONG).show()
                      return
                  }
                  val speedMs = (200 + speedSeek.progress * (9800.0 / 49.0)).toLong()
                  val intent = Intent(this, PlaybackService::class.java).apply {
                      action = PlaybackService.ACTION_START
                      putExtra(PlaybackService.EXTRA_BASE, base)
                      putExtra(PlaybackService.EXTRA_DIFF, diff)
                      putExtra(PlaybackService.EXTRA_COMBINED, isCombined)
                      putExtra(PlaybackService.EXTRA_SWAP_MS, speedMs)
                      putExtra(PlaybackService.EXTRA_SONG, if (songCheck.isChecked) songUri.toString() else "")
                      putExtra(PlaybackService.EXTRA_DURATION_MS, (durationSeek.progress + 1) * 60_000L)
                  }
                  startForegroundService(intent)
                  playing = true
                  visualizer.setParams(base, diff, isCombined)
                  visualizer.isRunning = true
                  Toast.makeText(this, "پخش شروع شد", Toast.LENGTH_SHORT).show()
              }

              private fun updateServiceIfPlaying() {
                  if (!playing || !baseChosen) return
                  val isCombined = modeGroup.checkedRadioButtonId == modeGroup.getChildAt(1).id
                  val base = baseSeek.progress + 50
                  val diff = if (diffChosen) diffSeek.progress else 0
                  val safeDiff = if (isCombined) diff.coerceAtMost(base - 1) else 0
                  val speedMs = (200 + speedSeek.progress * (9800.0 / 49.0)).toLong()
                  val intent = Intent(this, PlaybackService::class.java).apply {
                      action = PlaybackService.ACTION_UPDATE
                      putExtra(PlaybackService.EXTRA_BASE, base)
                      putExtra(PlaybackService.EXTRA_DIFF, safeDiff)
                      putExtra(PlaybackService.EXTRA_COMBINED, isCombined)
                      putExtra(PlaybackService.EXTRA_SWAP_MS, speedMs)
                  }
                  startService(intent)
                  visualizer.setParams(base, safeDiff, isCombined)
              }
          }

          private class WaveView(context: android.content.Context) : View(context) {
              private val wavePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(103, 153, 255); style = Paint.Style.STROKE; strokeWidth = 3.2f }
              private val gridPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(40, 49, 77); strokeWidth = 1f }
              private var base = 200
              private var diff = 0
              private var combined = false
              var isRunning = false
                  set(value) { field = value; invalidate() }
              private var phase = 0f
              private val bg = GradientDrawable().apply { setColor(Color.rgb(20, 25, 44)); cornerRadius = 24f }

              fun setParams(b: Int, d: Int, c: Boolean) { base = b.coerceIn(50, 800); diff = d.coerceAtLeast(0); combined = c; invalidate() }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  canvas.drawRoundRect(0f, 0f, width.toFloat(), height.toFloat(), 24f, 24f, Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(20, 25, 44) })
                  val w = width.toFloat(); val h = height.toFloat(); val mid = h / 2f
                  for (i in 1..3) canvas.drawLine(0f, h * i / 4f, w, h * i / 4f, gridPaint)
                  val path = Path()
                  val cycles = (base / 100f).coerceIn(1f, 8f)
                  for (x in 0..w.toInt()) {
                      val t = x / w.coerceAtLeast(1f)
                      val y = mid + kotlin.math.sin((t * cycles * 2f * Math.PI + phase).toDouble()).toFloat() * h * 0.31f
                      if (x == 0) path.moveTo(x.toFloat(), y) else path.lineTo(x.toFloat(), y)
                  }
                  canvas.drawPath(path, wavePaint)
                  if (combined && diff > 0) {
                      val second = Path()
                      val cycles2 = ((base + diff) / 100f).coerceIn(1f, 12f)
                      for (x in 0..w.toInt()) {
                          val t = x / w.coerceAtLeast(1f)
                          val y = mid + kotlin.math.sin((t * cycles2 * 2f * Math.PI + phase + 0.8).toDouble()).toFloat() * h * 0.23f
                          if (x == 0) second.moveTo(x.toFloat(), y) else second.lineTo(x.toFloat(), y)
                      }
                      val p2 = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(204, 119, 255); style = Paint.Style.STROKE; strokeWidth = 2.4f }
                      canvas.drawPath(second, p2)
                  }
                  if (isRunning) {
                      phase += 0.13f
                      postInvalidateDelayed(33)
                  }
              }
          }
          KOTLIN

          cat > app/src/main/java/com/sleeptune/app/PlaybackService.kt <<'KOTLIN'
          package com.sleeptune.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.media.MediaPlayer
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.net.Uri
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicInteger
          import java.util.concurrent.atomic.AtomicLong
          import kotlin.math.PI
          import kotlin.math.sin

          class PlaybackService : Service() {
              companion object {
                  const val ACTION_START = "com.sleeptune.START"
                  const val ACTION_UPDATE = "com.sleeptune.UPDATE"
                  const val ACTION_STOP = "com.sleeptune.STOP"
                  const val EXTRA_BASE = "base"
                  const val EXTRA_DIFF = "diff"
                  const val EXTRA_COMBINED = "combined"
                  const val EXTRA_SWAP_MS = "swapMs"
                  const val EXTRA_SONG = "song"
                  const val EXTRA_DURATION_MS = "durationMs"
                  private const val CHANNEL_ID = "sleeptune_audio"
              }

              private val running = AtomicBoolean(false)
              private val baseHz = AtomicInteger(200)
              private val diffHz = AtomicInteger(0)
              private val combinedMode = AtomicBoolean(false)
              private val swapMs = AtomicLong(1000L)
              private val handler = Handler(Looper.getMainLooper())
              private var track: AudioTrack? = null
              private var audioThread: Thread? = null
              private var player: MediaPlayer? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  createNotificationChannel()
                  startForeground(11, buildNotification())
                  when (intent?.action) {
                      ACTION_START -> {
                          stopAudioAndSong()
                          updateParams(intent)
                          running.set(true)
                          val song = intent.getStringExtra(EXTRA_SONG).orEmpty()
                          val duration = intent.getLongExtra(EXTRA_DURATION_MS, 1_800_000L)
                          if (song.isNotBlank()) playSongThenTone(song, duration) else startTone()
                      }
                      ACTION_UPDATE -> updateParams(intent)
                      ACTION_STOP -> stopPlayback()
                  }
                  return START_NOT_STICKY
              }

              private fun updateParams(i: Intent) {
                  val base = i.getIntExtra(EXTRA_BASE, baseHz.get()).coerceIn(50, 800)
                  val combined = i.getBooleanExtra(EXTRA_COMBINED, combinedMode.get())
                  val requestedDiff = i.getIntExtra(EXTRA_DIFF, diffHz.get()).coerceAtLeast(0)
                  baseHz.set(base)
                  combinedMode.set(combined)
                  diffHz.set(if (combined) requestedDiff.coerceAtMost(base - 1) else 0)
                  swapMs.set(i.getLongExtra(EXTRA_SWAP_MS, swapMs.get()).coerceIn(200L, 10_000L))
              }

              private fun playSongThenTone(uriString: String, durationMs: Long) {
                  try {
                      val mp = MediaPlayer()
                      player = mp
                      mp.setDataSource(this, Uri.parse(uriString))
                      mp.setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                      mp.isLooping = true
                      mp.setOnPreparedListener { ready ->
                          if (!running.get()) { ready.release(); return@setOnPreparedListener }
                          ready.start()
                          handler.postDelayed({
                              try {
                                  if (player === ready) {
                                      ready.setVolume(0f, 0f)
                                      ready.stop()
                                      ready.release()
                                      player = null
                                      startTone()
                                  }
                              } catch (_: Exception) { startTone() }
                          }, durationMs)
                      }
                      mp.setOnErrorListener { _, _, _ ->
                          try { mp.release() } catch (_: Exception) {}
                          player = null
                          startTone()
                          true
                      }
                      mp.prepareAsync()
                  } catch (_: Exception) { startTone() }
              }

              private fun startTone() {
                  if (!running.get()) return
                  if (audioThread?.isAlive == true) return
                  val sampleRate = 44100
                  val minBytes = AudioTrack.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_OUT_STEREO, AudioFormat.ENCODING_PCM_16BIT).coerceAtLeast(4096)
                  val audio = AudioTrack.Builder()
                      .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                      .setAudioFormat(AudioFormat.Builder().setSampleRate(sampleRate).setEncoding(AudioFormat.ENCODING_PCM_16BIT).setChannelMask(AudioFormat.CHANNEL_OUT_STEREO).build())
                      .setBufferSizeInBytes(minBytes * 2)
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build()
                  track = audio
                  audio.play()
                  audioThread = Thread {
                      val frames = 1024
                      val buffer = ShortArray(frames * 2)
                      var phaseL = 0.0
                      var phaseR = 0.0
                      var frameCounter = 0L
                      var lastSwapState = false
                      while (running.get()) {
                          val base = baseHz.get().coerceIn(50, 800)
                          val diff = if (combinedMode.get()) diffHz.get().coerceAtMost(base - 1) else 0
                          val isCombined = combinedMode.get()
                          val periodFrames = (swapMs.get().coerceIn(200L, 10_000L) * sampleRate / 1000L).coerceAtLeast(1L)
                          for (i in 0 until frames) {
                              val swap = isCombined && diff > 0 && ((frameCounter / periodFrames) % 2L == 1L)
                              val fLeft: Int
                              val fRight: Int
                              if (!isCombined || diff == 0) {
                                  fLeft = base; fRight = base
                              } else if (!swap) {
                                  fLeft = base; fRight = base + diff
                              } else {
                                  fLeft = base + diff; fRight = base
                              }
                              phaseL += 2.0 * PI * fLeft / sampleRate
                              phaseR += 2.0 * PI * fRight / sampleRate
                              if (phaseL >= 2.0 * PI) phaseL -= 2.0 * PI
                              if (phaseR >= 2.0 * PI) phaseR -= 2.0 * PI
                              val amp = 0.20
                              buffer[i * 2] = (sin(phaseL) * Short.MAX_VALUE * amp).toInt().toShort()
                              buffer[i * 2 + 1] = (sin(phaseR) * Short.MAX_VALUE * amp).toInt().toShort()
                              frameCounter++
                          }
                          try { audio.write(buffer, 0, buffer.size) } catch (_: Exception) { break }
                      }
                      try { audio.pause(); audio.flush(); audio.stop(); audio.release() } catch (_: Exception) {}
                      if (track === audio) track = null
                  }.apply { name = "SleepTune-Audio"; start() }
              }

              private fun stopAudioAndSong() {
                  running.set(false)
                  try { player?.stop() } catch (_: Exception) {}
                  try { player?.release() } catch (_: Exception) {}
                  player = null
                  val oldThread = audioThread
                  try { oldThread?.join(600) } catch (_: InterruptedException) { Thread.currentThread().interrupt() }
                  try { track?.pause(); track?.flush(); track?.stop(); track?.release() } catch (_: Exception) {}
                  track = null
                  audioThread = null
              }

              private fun stopPlayback() {
                  running.set(false)
                  handler.removeCallbacksAndMessages(null)
                  try { player?.stop() } catch (_: Exception) {}
                  try { player?.release() } catch (_: Exception) {}
                  player = null
                  try { track?.pause(); track?.flush(); track?.stop(); track?.release() } catch (_: Exception) {}
                  track = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(CHANNEL_ID, "SleepTune audio", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun buildNotification(): Notification {
                  val open = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID).setContentTitle("SleepTune").setContentText("پخش صدا فعال است").setSmallIcon(android.R.drawable.ic_media_play).setContentIntent(open).setOngoing(true).build()
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this).setContentTitle("SleepTune").setContentText("پخش صدا فعال است").setSmallIcon(android.R.drawable.ic_media_play).setContentIntent(open).setOngoing(true).build()
                  }
              }

              override fun onDestroy() {
                  stopPlayback()
                  super.onDestroy()
              }
          }
          KOTLIN

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      
- name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SleepTune-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
