name: Build SleepTune APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
     
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sleeptune/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SleepTune"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.sleeptune.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sleeptune.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="SleepTune"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PlaybackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#80CBC4</item>
                  <item name="android:statusBarColor">#101010</item>
                  <item name="android:navigationBarColor">#101010</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowBackground">#101010</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/sleeptune/app/MainActivity.kt <<'EOF'
          package com.sleeptune.app

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.*
          import android.graphics.Typeface

          class MainActivity : Activity() {
              private var song: Uri? = null
              private lateinit var songLabel: TextView
              private lateinit var duration: EditText
              private lateinit var frequency: EditText
              private lateinit var noise: Spinner

              private val bg = Color.rgb(16, 16, 16)
              private val fg = Color.WHITE
              private val accent = Color.rgb(128, 203, 196)

              private fun label(text: String, size: Float = 16f): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = size
                      setTextColor(fg)
                      gravity = Gravity.CENTER
                      setPadding(8, 12, 8, 12)
                  }
              }

              private fun button(text: String, action: () -> Unit): Button {
                  return Button(this).apply {
                      this.text = text
                      setTextColor(Color.BLACK)
                      setBackgroundColor(accent)
                      setOnClickListener { action() }
                  }
              }

              private fun field(value: String, hintText: String): EditText {
                  return EditText(this).apply {
                      setText(value)
                      hint = hintText
                      setHintTextColor(Color.LTGRAY)
                      setTextColor(fg)
                      setSingleLine(true)
                      gravity = Gravity.CENTER
                      setPadding(12, 8, 12, 8)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = bg
                  window.navigationBarColor = bg

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(24, 20, 24, 20)
                      setBackgroundColor(bg)
                  }

                  root.addView(label("SleepTune", 28f))
                  root.addView(label("موسیقی برای به‌خواب‌رفتن", 17f))
                  root.addView(label("مرحله اول · انتخاب آهنگ"))

                  songLabel = label("هنوز آهنگی انتخاب نشده")
                  root.addView(songLabel)

                  root.addView(button("انتخاب آهنگ از گوشی") {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "audio/*"
                      }
                      startActivityForResult(intent, 100)
                  })

                  root.addView(label("مدت پخش آهنگ (دقیقه)"))
                  duration = field("30", "مثلاً 30")
                  root.addView(duration)

                  root.addView(label("مرحله دوم · صدای هنگام خواب"))
                  noise = Spinner(this)
                  val options = arrayOf(
                      "نویز سفید",
                      "نویز صورتی",
                      "نویز قهوه‌ای",
                      "صدای سینوسی"
                  )
                  noise.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      options
                  )
                  root.addView(noise)

                  root.addView(label("فرکانس صدای سینوسی (هرتز)"))
                  frequency = field("200", "مثلاً 200")
                  root.addView(frequency)

                  root.addView(label(
                      "پس از پایان زمان، صدا به‌آرامی تغییر می‌کند."
                  ))

                  root.addView(button("شروع پخش") {
                      startPlayback()
                  })

                  root.addView(button("توقف کامل") {
                      val i = Intent(this, PlaybackService::class.java)
                      i.action = "STOP"
                      startService(i)
                  })

                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 100 &&
                      resultCode == RESULT_OK &&
                      data?.data != null
                  ) {
                      song = data.data
                      try {
                          contentResolver.takePersistableUriPermission(
                              song!!,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      } catch (_: Exception) {}

                      songLabel.text = song?.lastPathSegment
                          ?: "آهنگ انتخاب شد"
                  }
              }

              private fun startPlayback() {
                  val selectedSong = song
                  if (selectedSong == null) {
                      Toast.makeText(
                          this,
                          "ابتدا یک آهنگ انتخاب کن",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  val minutes = duration.text.toString().toLongOrNull()
                  val hz = frequency.text.toString().toIntOrNull()

                  if (minutes == null || minutes < 1 || minutes > 1440) {
                      Toast.makeText(
                          this,
                          "مدت پخش باید بین ۱ تا ۱۴۴۰ دقیقه باشد",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  if (hz == null || hz !in 20..20000) {
                      Toast.makeText(
                          this,
                          "فرکانس باید بین ۲۰ تا ۲۰۰۰۰ هرتز باشد",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  val i = Intent(this, PlaybackService::class.java).apply {
                      action = "START"
                      putExtra("song", selectedSong.toString())
                      putExtra("duration", minutes * 60_000L)
                      putExtra("noise", noise.selectedItemPosition)
                      putExtra("frequency", hz)
                  }

                  try {
                      startForegroundService(i)
                  } catch (e: Exception) {
                      Toast.makeText(
                          this,
                          "شروع پخش ناموفق بود: ${e.message}",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/sleeptune/app/PlaybackService.kt <<'EOF'
          package com.sleeptune.app

          import android.app.*
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.media.MediaPlayer
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import java.util.Random
          import kotlin.math.PI
          import kotlin.math.sin

          class PlaybackService : Service() {
              private val handler = Handler(Looper.getMainLooper())
              private var player: MediaPlayer? = null
              private var track: AudioTrack? = null
              private var noiseThread: Thread? = null
              @Volatile private var running = false
              private var lastBrown = 0.0
              private var lastPink = 0.0
              private var phase = 0.0

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(
                  intent: Intent?,
                  flags: Int,
                  startId: Int
              ): Int {
                  if (intent?.action == "STOP") {
                      stopPlayback()
                      return START_NOT_STICKY
                  }

                  if (intent?.action == "START") {
                      stopAudioOnly()
                      createNotification()
                      val uri = intent.getStringExtra("song") ?: return START_NOT_STICKY
                      val duration = intent.getLongExtra("duration", 1_800_000L)
                      val noise = intent.getIntExtra("noise", 1)
                      val frequency = intent.getIntExtra("frequency", 200)
                      playSongThenNoise(uri, duration, noise, frequency)
                  }

                  return START_NOT_STICKY
              }

              private fun createNotification() {
                  val channelId = "sleeptune_playback"

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "SleepTune playback",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(channel)
                  }

                  val notification = Notification.Builder(this, channelId)
                      .setContentTitle("SleepTune")
                      .setContentText("پخش صدا فعال است")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setOngoing(true)
                      .build()

                  startForeground(1, notification)
              }

              private fun playSongThenNoise(
                  uri: String,
                  duration: Long,
                  noise: Int,
                  frequency: Int
              ) {
                  try {
                      player = MediaPlayer().apply {
                          setDataSource(this@PlaybackService, android.net.Uri.parse(uri))
                          setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .build()
                          )
                          setOnPreparedListener { mp ->
                              mp.start()
                              val fadeStart = (duration - 5000L).coerceAtLeast(0L)

                              handler.postDelayed({
                                  fadeSong(mp, noise, frequency)
                              }, fadeStart)
                          }
                          prepareAsync()
                      }
                  } catch (_: Exception) {
                      stopPlayback()
                  }
              }

              private fun fadeSong(
                  mp: MediaPlayer,
                  noise: Int,
                  frequency: Int
              ) {
                  val started = System.currentTimeMillis()
                  val fade = object : Runnable {
                      override fun run() {
                          if (player !== mp) return

                          val elapsed = System.currentTimeMillis() - started
                          val volume = (1.0 - elapsed / 5000.0)
                              .coerceIn(0.0, 1.0).toFloat()

                          try {
                              mp.setVolume(volume, volume)
                          } catch (_: Exception) {}

                          if (elapsed < 5000L) {
                              handler.postDelayed(this, 100L)
                          } else {
                              try { mp.stop() } catch (_: Exception) {}
                              try { mp.release() } catch (_: Exception) {}
                              if (player === mp) player = null
                              startNoise(noise, frequency)
                          }
                      }
                  }
                  handler.post(fade)
              }

              private fun startNoise(type: Int, frequency: Int) {
                  stopNoise()

                  val sampleRate = 44100
                  val minBuffer = AudioTrack.getMinBufferSize(
                      sampleRate,
                      AudioFormat.CHANNEL_OUT_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  ).coerceAtLeast(4096)

                  track = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build()
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setSampleRate(sampleRate)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .build()
                      )
                      .setBufferSizeInBytes(minBuffer * 2)
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build()

                  val audio = track ?: return
                  audio.setVolume(0.25f)
                  audio.play()
                  running = true

                  noiseThread = Thread {
                      val random = Random()
                      val samples = ShortArray(2048)
                      val amplitude = 4500.0

                      while (running) {
                          for (i in samples.indices) {
                              val value = when (type) {
                                  3 -> {
                                      val s = sin(phase)
                                      phase += 2.0 * PI * frequency / sampleRate
                                      if (phase >= 2.0 * PI) phase -= 2.0 * PI
                                      s
                                  }

                                  2 -> {
                                      val white = random.nextDouble() * 2.0 - 1.0
                                      lastBrown = (lastBrown + white * 0.02)
                                          .coerceIn(-1.0, 1.0)
                                      lastBrown
                                  }

                                  1 -> {
                                      val white = random.nextDouble() * 2.0 - 1.0
                                      lastPink = 0.98 * lastPink + 0.08 * white
                                      lastPink.coerceIn(-1.0, 1.0)
                                  }

                                  else -> random.nextDouble() * 2.0 - 1.0
                              }

                              samples[i] = (value * amplitude)
                                  .toInt().coerceIn(-32768, 32767).toShort()
                          }

                          try {
                              audio.write(samples, 0, samples.size)
                          } catch (_: Exception) {
    
